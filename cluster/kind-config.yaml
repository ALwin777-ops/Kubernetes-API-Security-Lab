kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: api-security-lab
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: "C:/Users/alwin/Documents/Terraforms/K8s/Kubernetes API Security Lab/audit/audit-policy.yaml"
        containerPath: /etc/kubernetes/audit-policy.yaml
        readOnly: true
      - hostPath: "C:/Users/alwin/Documents/Terraforms/K8s/Kubernetes API Security Lab/audit-logs"
        containerPath: /var/log/kubernetes/audit
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            audit-policy-file: /etc/kubernetes/audit-policy.yaml
            audit-log-path: /var/log/kubernetes/audit/audit.log
            audit-log-maxage: "7"
            audit-log-maxbackup: "3"
            audit-log-maxsize: "100"
          extraVolumes:
            - name: audit-policy
              hostPath: /etc/kubernetes/audit-policy.yaml
              mountPath: /etc/kubernetes/audit-policy.yaml
              readOnly: true
              pathType: File
            - name: audit-log
              hostPath: /var/log/kubernetes/audit
              mountPath: /var/log/kubernetes/audit
              readOnly: false
              pathType: DirectoryOrCreate
